<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Ki — AI-Native SDLC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020806"/>
      <stop offset="1" stop-color="#04140f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="0.35" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#ecfdf5"/>
      <stop offset="0.65" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#0b2e22" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
    <path id="orbitA" d="M960 170 m-150 0 a150 58 0 1 0 300 0 a150 58 0 1 0 -300 0"/>
    <path id="orbitB" d="M960 170 m-110 0 a110 110 0 1 0 220 0 a110 110 0 1 0 -220 0"/>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .grid { animation: drift 10s linear infinite; }
    @keyframes drift { to { transform: translate(-28px,-28px); } }
    .orb { animation: float 9s ease-in-out infinite; }
    .orb2 { animation: float 12s ease-in-out infinite reverse; }
    @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,24px); } }
    .drop { animation: fall linear infinite; }
    @keyframes fall { from { transform: translateY(-140px); } to { transform: translateY(380px); } }
    .type { clip-path: inset(0 100% 0 0); animation: type 1.8s steps(14) .3s forwards; }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    .glitch { animation: glitch 6s steps(1) infinite; }
    @keyframes glitch { 0%, 91%, 100% { transform: translate(0,0); opacity: 0; } 92% { transform: translate(-4px,1px); opacity: .7; } 94% { transform: translate(5px,-1px); opacity: .6; } 96% { transform: translate(-2px,0); opacity: .5; } }
    .fade { opacity: 0; animation: fadeup .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: 1.2s; } .d2 { animation-delay: 1.7s; } .d3 { animation-delay: 2.2s; }
    @keyframes fadeup { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateY(-60px); } to { transform: translateY(400px); } }
    .ripple { animation: ripple 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .r2 { animation-delay: 1s; } .r3 { animation-delay: 2s; }
    @keyframes ripple { from { transform: scale(.4); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
    .spin { animation: spin 14s linear infinite; transform-origin: 960px 170px; }
    .spinr { animation: spin 22s linear infinite reverse; transform-origin: 960px 170px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .wire { stroke-dasharray: 3 9; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    .eq rect { animation: eq 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    @keyframes eq { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .type, .fade { clip-path: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <g class="grid"><rect width="1240" height="380" fill="url(#grid)"/></g>
    <circle class="orb" cx="980" cy="120" r="260" fill="url(#orb)"/>
    <circle class="orb2" cx="640" cy="330" r="220" fill="url(#orb2)"/>

    <!-- code rain -->
    <g class="mono" font-size="13" fill="url(#rain)" opacity="0.55">
      <text class="drop" x="560" y="0" style="animation-duration:5.5s">0<tspan x="560" dy="16">1</tspan><tspan x="560" dy="16">λ</tspan><tspan x="560" dy="16">{</tspan><tspan x="560" dy="16">}</tspan><tspan x="560" dy="16">✦</tspan></text>
      <text class="drop" x="620" y="0" style="animation-duration:7s;animation-delay:-2s">a<tspan x="620" dy="16">g</tspan><tspan x="620" dy="16">e</tspan><tspan x="620" dy="16">n</tspan><tspan x="620" dy="16">t</tspan></text>
      <text class="drop" x="690" y="0" style="animation-duration:4.8s;animation-delay:-3.4s">→<tspan x="690" dy="16">0</tspan><tspan x="690" dy="16">1</tspan><tspan x="690" dy="16">1</tspan><tspan x="690" dy="16">◆</tspan><tspan x="690" dy="16">;</tspan></text>
      <text class="drop" x="1130" y="0" style="animation-duration:6.2s;animation-delay:-1s">s<tspan x="1130" dy="16">h</tspan><tspan x="1130" dy="16">i</tspan><tspan x="1130" dy="16">p</tspan></text>
      <text class="drop" x="1170" y="0" style="animation-duration:5s;animation-delay:-4s">1<tspan x="1170" dy="16">0</tspan><tspan x="1170" dy="16">⎇</tspan><tspan x="1170" dy="16">✔</tspan></text>
      <text class="drop" x="760" y="0" style="animation-duration:8s;animation-delay:-5s">✔<tspan x="760" dy="16">t</tspan><tspan x="760" dy="16">e</tspan><tspan x="760" dy="16">s</tspan><tspan x="760" dy="16">t</tspan></text>
    </g>
    <rect class="scan" width="1200" height="60" fill="#34d399" opacity="0.05"/>

    <!-- identity -->
    <g transform="translate(64,72)">
      <text class="mono fade" x="0" y="0" font-size="16" fill="#4b6b5f">~/kondohiroki <tspan fill="#34d399">❯</tspan> whoami</text>
      <g class="type">
        <text class="sans" x="0" y="72" font-size="64" font-weight="900" fill="#10b981" opacity="0.35" filter="url(#soft)" letter-spacing="-1.5">AI-Native SDLC</text>
        <text class="sans" x="0" y="72" font-size="64" font-weight="900" fill="url(#title)" letter-spacing="-1.5">AI-Native SDLC</text>
        <g class="glitch">
          <text class="sans" x="0" y="72" font-size="64" font-weight="900" fill="#22d3ee" opacity="0.6" letter-spacing="-1.5" style="mix-blend-mode:screen">AI-Native SDLC</text>
        </g>
      </g>
      <text class="sans fade d1" x="2" y="120" font-size="22" fill="#d1fae5">Hi, I'm <tspan font-weight="800" fill="#fff">Ki</tspan> — I ship software with a team of agents.</text>
      <text class="mono fade d2" x="2" y="158" font-size="15" fill="#6b8f80">spec <tspan fill="#34d399">→</tspan> contract <tspan fill="#34d399">→</tspan> agents build <tspan fill="#34d399">→</tspan> auditors verify <tspan fill="#34d399">→</tspan> AI review <tspan fill="#34d399">→</tspan> ship</text>
      <g transform="translate(2,190)"><g class="fade d3">
        <rect width="190" height="32" rx="16" fill="#052e22" stroke="#10b981" stroke-opacity=".5"/>
        <g class="eq" transform="translate(16,9)" fill="#34d399">
          <rect x="0" width="3" height="14" rx="1.5"/>
          <rect x="5" width="3" height="14" rx="1.5" style="animation-delay:-.3s"/>
          <rect x="10" width="3" height="14" rx="1.5" style="animation-delay:-.6s"/>
        </g>
        <text class="mono" x="38" y="21" font-size="13" fill="#a7f3d0">agentic coding</text>
        <rect x="202" width="160" height="32" rx="16" fill="#052e22" stroke="#10b981" stroke-opacity=".3"/>
        <text class="mono" x="218" y="21" font-size="13" fill="#a7f3d0">📍 Bangkok, TH</text>
        <rect x="374" width="92" height="32" rx="16" fill="#052e22" stroke="#10b981" stroke-opacity=".3"/>
        <text class="mono" x="390" y="21" font-size="13" fill="#a7f3d0">🇹🇭 Thai</text>
      </g></g>
    </g>

    <!-- agent core with orbits -->
    <g class="spinr" opacity="0.5">
      <circle cx="960" cy="170" r="128" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="1 7"/>
    </g>
    <g class="spin">
      <use href="#orbitA" fill="none" stroke="#34d399" stroke-opacity=".35" stroke-width="1.2"/>
    </g>
    <use href="#orbitB" fill="none" stroke="#14b8a6" stroke-opacity=".25" stroke-width="1"/>
    <g filter="url(#glow)">
      <circle r="5" fill="#6ee7b7"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#orbitA"/></animateMotion></circle>
      <circle r="3.5" fill="#a7f3d0"><animateMotion dur="5s" begin="-2.5s" repeatCount="indefinite"><mpath href="#orbitA"/></animateMotion></circle>
      <circle r="4" fill="#2dd4bf"><animateMotion dur="7s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#orbitB"/></animateMotion></circle>
    </g>
    <circle class="ripple" cx="960" cy="170" r="34" fill="none" stroke="#34d399" stroke-width="2"/>
    <circle class="ripple r2" cx="960" cy="170" r="34" fill="none" stroke="#34d399" stroke-width="2"/>
    <circle class="ripple r3" cx="960" cy="170" r="34" fill="none" stroke="#34d399" stroke-width="2"/>
    <circle cx="960" cy="170" r="36" fill="#03140e" stroke="#34d399" stroke-width="2.5" filter="url(#glow)"/>
    <text class="mono" x="960" y="178" font-size="22" text-anchor="middle" fill="#ecfdf5">✦</text>

    <g class="mono" font-size="11" fill="#a7f3d0">
      <path class="wire" d="M960 170 L842 92 M960 170 L1088 92 M960 170 L836 252 M960 170 L1086 252" stroke="#34d399" stroke-opacity=".6" stroke-width="1.5"/>
      <g><circle class="dot" cx="842" cy="92" r="7" fill="#34d399"/><text x="842" y="74" text-anchor="middle">plan</text></g>
      <g><circle class="dot" cx="1088" cy="92" r="7" fill="#6ee7b7" style="animation-delay:.5s"/><text x="1088" y="74" text-anchor="middle">build</text></g>
      <g><circle class="dot" cx="836" cy="252" r="7" fill="#2dd4bf" style="animation-delay:1s"/><text x="836" y="278" text-anchor="middle">verify</text></g>
      <g><circle class="dot" cx="1086" cy="252" r="7" fill="#a7f3d0" style="animation-delay:1.5s"/><text x="1086" y="278" text-anchor="middle">ship</text></g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="22" fill="none" stroke="#10b981" stroke-opacity=".35"/>
</svg>
